#
# FlatLaf UI default overrides for LauncherLookAndFeel.
# Colors are carried over from the old Substance "Graphite" skin
# (see git history for skin/graphite.colorschemes) to keep a similar look.
#

@background = #232323
@foreground = #B4B4B4
@accentColor = #4A6FFF

@disabledBackground = #2A2A2A
@disabledForeground = #6E6E6E

@borderColor = #3A3A3A
@selectionBackground = @accentColor
@selectionForeground = #FFFFFF

Component.arrowType = triangle
Button.arc = 4
Component.arc = 4
TextComponent.arc = 4
ProgressBar.arc = 4

# Buttons were noticeably small after the FlatLaf switch; bump them up.
Button.font = +1
Button.margin = 4,14,4,14
ToggleButton.font = +1
ToggleButton.margin = 4,14,4,14

Panel.background = @background

# Unselected rows in the instance list are flush with the rest of the window
# (title bar, panels, etc) instead of standing out as a separate grey box.
List.background = @background
Table.background = @background
Tree.background = @background
ScrollPane.background = @background
Viewport.background = @background
EditorPane.background = @background

List.selectionBackground = @accentColor
List.selectionForeground = #FFFFFF
Table.selectionBackground = @accentColor
Table.selectionForeground = #FFFFFF

TitlePane.background = @background
TitlePane.inactiveBackground = @background
TitlePane.foreground = @foreground
TitlePane.inactiveForeground = #7A7A7A
